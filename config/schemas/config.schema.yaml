$schema: "http://json-schema.org/draft-07/schema#"
title: "MPNSTPhase1Config"
type: "object"
properties:
  input_rds:
    type: "string"
  random_seed:
    type: "integer"
  dataset_id_column:
    type: "string"
  candidate_columns:
    type: "array"
    items:
      type: "string"
  qc:
    type: "object"
    properties:
      min_features:
        type: "integer"
      max_features:
        type: "integer"
      min_counts:
        type: "integer"
      max_counts:
        type: "integer"
      max_percent_mt:
        type: "number"
      max_percent_ribo:
        type: "number"
    required:
      - "min_features"
      - "max_features"
      - "min_counts"
      - "max_counts"
      - "max_percent_mt"
      - "max_percent_ribo"
  doublet_detection:
    type: "object"
    properties:
      method:
        type: "string"
        enum: ["scDblFinder", "DoubletFinder", "None"]
      expected_doublet_rate:
        type: "number"
    required:
      - "method"
      - "expected_doublet_rate"
  normalization:
    type: "object"
    properties:
      method:
        type: "string"
        enum: ["SCTransform", "LogNormalize"]
      n_features:
        type: "integer"
    required:
      - "method"
      - "n_features"
  pca:
    type: "object"
    properties:
      npcs:
        type: "integer"
      pc_ranges_to_evaluate:
        type: "array"
        items:
          type: "array"
          minItems: 2
          maxItems: 2
          items:
            type: "integer"
    required:
      - "npcs"
      - "pc_ranges_to_evaluate"
  clustering:
    type: "object"
    properties:
      resolutions:
        type: "array"
        items:
          type: "number"
    required:
      - "resolutions"
  markers:
    type: "object"
    properties:
      test_use:
        type: "string"
      min_pct:
        type: "number"
      logfc_threshold:
        type: "number"
      only_pos:
        type: "boolean"
    required:
      - "test_use"
      - "min_pct"
      - "logfc_threshold"
      - "only_pos"
  output_dirs:
    type: "object"
    properties:
      datasets:
        type: "string"
      combined:
        type: "string"
      reports:
        type: "string"
      logs:
        type: "string"
      benchmarks:
        type: "string"
    required:
      - "datasets"
      - "combined"
      - "reports"
      - "logs"
      - "benchmarks"
required:
  - "input_rds"
  - "random_seed"
  - "dataset_id_column"
  - "candidate_columns"
  - "qc"
  - "doublet_detection"
  - "normalization"
  - "pca"
  - "clustering"
  - "markers"
  - "output_dirs"

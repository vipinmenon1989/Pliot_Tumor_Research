name: Phase 1 CI Workflow

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Miniconda and install Conda environment
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: R_env
          environment-file: workflow/envs/R_env_portable.yaml
          auto-activate-base: false
          use-only-tar-bz2: true # For faster downloads

      # 3. Cache Conda environment
      - name: Cache Conda env
        uses: actions/cache@v4
        with:
          path: /usr/share/miniconda/envs/R_env
          key: conda-${{ runner.os }}-${{ hashFiles('workflow/envs/R_env_portable.yaml') }}
          restore-keys: |
            conda-${{ runner.os }}-

      # 4. Run Environment Preflight Checker
      - name: Run Environment Preflight Checker
        run: |
          python scripts/python/preflight_checker.py --mode synthetic

      # 4b. Run Preflight Checker Unit Tests
      - name: Run Preflight Checker Unit Tests
        run: |
          python tests/unit/test_preflight.py

      # 5. Run static checks and Project State Validator
      - name: Run Project State Consistency Validator
        run: |
          python scripts/python/validate_project_state.py

      # 6. Run Snakemake dry-run & DAG Regression Check (Synthetic Config)
      - name: Snakemake dry-run & DAG Regression Check (Synthetic Config)
        run: |
          snakemake --snakefile workflow/Snakefile --configfile config/config.test.yaml -n -p --rerun-triggers mtime synthetic_complete > dry_run.out
          cat dry_run.out
          if grep -E "processed_mpnst.rds" dry_run.out; then
              echo "ERROR: Synthetic dry-run references real HPC paths or datasets!"
              exit 1
          fi
          echo "SUCCESS: Synthetic DAG has no real HPC RDS dependency."

      # 7. Execute Clean-Room Synthetic Workflow
      - name: Execute Clean-Room Synthetic Workflow
        run: |
          mkdir -p test_clean_room
          ln -sfn ../scripts test_clean_room/scripts
          ln -sfn ../tests test_clean_room/tests
          ln -sfn ../config test_clean_room/config
          ln -sfn ../workflow test_clean_room/workflow
          snakemake -s workflow/Snakefile -d test_clean_room --configfile config/config.test.yaml --cores 2 --rerun-triggers mtime synthetic_complete

      # 8. Verify Required Clean-Room Target Outputs
      - name: Verify Clean-Room Target Outputs
        run: |
          test -f test_clean_room/results/combined/pre_integration/combined_preintegration.rds
          test -f test_clean_room/reports/PRE_INTEGRATION_ASSESSMENT.md
          test -f test_clean_room/reports/INTEGRATION_PREPARATION.md
          test -f test_clean_room/reports/milestones/M8_REPORT.md
          test -f test_clean_room/logs/workflow/phase1_complete.done
          test -f test_clean_room/logs/workflow/validate_project_state.done
